; Menjalankan php-fpm DAN queue worker Laravel (Word Report Generator, dst)
; di dalam SATU container yang sama -- supaya deploy tetap "rebuild + restart
; satu container" seperti sekarang, tanpa perlu container/service tambahan
; atau langkah manual apa pun di server (lihat Dockerfile: CMD memanggil
; supervisord ini, bukan php-fpm langsung).
;
; Tanpa ini, job yang di-dispatch ke queue (mis. GenerateWordReportJob) tidak
; akan pernah diproses di production -- persis gejala "pending selamanya"
; yang sama seperti kalau `php artisan queue:work` tidak jalan di lokal.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; Socket + RPC supaya `docker exec <container> supervisorctl status` bisa
; dipakai untuk mengecek/merestart worker. Tanpa 3 blok ini supervisorctl
; menjawab "unix:///var/run/supervisor.sock no such file" walaupun
; supervisord-nya sendiri jalan normal.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker antrean 'default': job pendek & sering (email, notifikasi, event SLA).
; --timeout=120 lebih pendek dari retry_after queue (set DB_QUEUE_RETRY_AFTER
; di .env, default 90 -> naikkan ke 1800) supaya job yang benar-benar nyangkut
; dibunuh worker DULU sebelum queue menaruhnya ulang -- mencegah eksekusi dobel.
; --max-time=3600: worker restart sendiri tiap 1 jam (cegah memory creep) --
; autorestart=true langsung menyalakannya lagi.
; directory= HARUS sama dengan WORKDIR di Dockerfile (/var/www/html). Sampai
; 12 Nov 2026 ketiga program artisan memakai /var/www/ecosystem yang tidak ada
; di container -> "couldn't chdir ... ENOENT" -> FATAL, sehingga queue worker
; dan scheduler TIDAK PERNAH jalan di production. Cek dengan
; `docker exec ecosystem_prod supervisorctl status` setelah deploy.
[program:queue-worker]
command=php artisan queue:work --queue=default --tries=2 --sleep=3 --timeout=120 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler Laravel: SEMUA Schedule:: di routes/console.php (email:process-inbox,
; reminder tiket, teams:sync-chat-messages, teams:flush-outbox, dst). Sampai
; 11 Nov 2026 program ini tidak ada dan tidak ada cron di host -> semua task
; terjadwal di production tidak pernah jalan kecuali `schedule:run` diketik
; manual (itu hanya SATU tick, lalu keluar).
;
; schedule:work = proses yang hidup terus dan menjalankan tick tiap menit.
; JANGAN ditambah cron `schedule:run` di host juga -> task jalan dobel.
;
; Setelah mengubah .env: `supervisorctl restart scheduler` -- proses anak
; mewarisi env lama dari proses induknya.
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker khusus antrean 'reports' (GenerateWordReportJob) -- job panjang
; (5-10 menit: baca template + tool call + code interpreter). Dipisah supaya
; TIDAK memblokir worker 'default'. --timeout=900 = sama dengan $timeout job,
; dan HARUS < DB_QUEUE_RETRY_AFTER (.env, set 1800). --tries=2 selaras dengan
; $tries job. WithoutOverlapping di job mencegah dobel-generate laporan yang sama.
[program:queue-worker-reports]
command=php artisan queue:work --queue=reports --tries=2 --sleep=3 --timeout=900 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
